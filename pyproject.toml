[project]
name = "barbellscan"
version = "0.1.0"
description = "Bildbasierte Auswertung der Durchbiegung von Powerlifting-Langhanteln (Tracking, Validierung, Statistik)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "opencv-python-headless",
    "matplotlib",
    "scienceplots",
    "joblib",
    "pydantic>=2",
    "pyyaml",
    "pyarrow",
    "typer",
    "scipy-stubs~=1.18.1",
]

[dependency-groups]
dev = ["pytest", "ruff", "pre-commit"]

[project.scripts]
barbellscan = "barbellscan.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barbellscan"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
